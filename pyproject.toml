[project]
name = "lm-memory-capacity"
version = "0.1.0"
description = "A minimal reproduction of the synthetic memorization experiment in arXiv:2505.24832"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memory-capacity = "memory_capacity.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_capacity"]

[tool.pytest.ini_options]
pythonpath = ["src"]

